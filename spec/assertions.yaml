# Canonical assertion definitions. Language-neutral.
#
# arity counts required arguments to the function form, excluding the
# failure seat and including the trailing message. A type the caller
# states counts as an argument, whether a language takes it as a value
# or as a type parameter. Optional arguments do not count: the
# relaxations, a golden comparison's scrubbers, and the options of a
# property or a history check.
#
# package is empty for an assertion in the language's root namespace,
# and names a subpackage otherwise.
#
# relaxations lists the modifiers an assertion accepts. A relaxation
# widens what counts as equal for one call, and never for a whole run.
#
# detail_fields names the values a failure carries, and a failing
# assertion carries exactly these. got is what the assertion observed
# and want is what it required, so an assertion whose failure holds
# neither states no fields and reports the caller's message alone.
version: "5.0.0"

# What a caller may relax, for one call.
#
# Both exist because a dynamically typed language cannot tell two cases
# apart that a statically typed one keeps separate. A language whose
# types already settle the question declares the relaxation absent in
# its overlay rather than shipping one that does nothing.
relaxations:
  "equate-empty":
    summary: >
      An absent container equals an empty one of the same type. Without
      it a null map and an empty map are different values, which is what
      the standard states by default.
  "equate-nans":
    summary: >
      A NaN equals another NaN of the same type. Without it NaN is
      unequal to itself, which is what IEEE 754 states and what the
      standard states by default.

# What a corpus case may hand an assertion in place of a value.
#
# A case states its arguments as typed literals, which cannot describe a
# callable. Most of what the assertions taking one need is a behaviour
# from a small fixed set, so a case names the behaviour and each
# implementation builds it natively. A kind an implementation cannot
# build is a declared skip, the same as any other case.
#
# A property form hands a subject the generated arguments in place of the
# input or the operands that the subject's summary states.
subjects:
  "returns-ok":
    summary: >
      Does the work and returns success, whatever it was handed. As the
      subject of a member, it returns its input, 1, and its domain is 1, 2
      and 3.
  "reads-handle":
    summary: >
      Reads the cancellation handle and answers the reason it gives,
      or success when the handle is absent or still running.
  "ignores-handle":
    summary: >
      Answers success without reading the handle at all.
  "raises":
    summary: >
      Raises rather than answering.
  "fails-otherwise":
    summary: >
      Returns a failure of its own, unrelated to any handle it was given.
      As the subject of total, its domain is 1, 2 and 3.
  "dereferences-handle":
    summary: >
      Reads a handle without checking it is there, so a missing one
      crashes it.
  "never-settles":
    summary: >
      Reports a failure on every attempt. As the subject of poisoned,
      inducing changes nothing, and every reading reports the failure.
  "settles-after":
    summary: >
      Reports a failure twice and succeeds on the third attempt. As the
      subject of poisoned, inducing changes nothing, and the third reading
      succeeds.
  "accumulates":
    summary: >
      Changes the observed state once per call: a counter that starts at 0
      and rises by one per call, whatever the input. As the subject of
      monotonic, it advances 5 steps.
  "leaves-state-alone":
    summary: >
      Reads the observed state and changes nothing.
  "sets-value":
    summary: >
      A cell that starts at 0. A call sets it to the call's input, 7, and
      an observation reads it.
  "counts-calls":
    summary: >
      Returns the number of times it has been called, starting at 1,
      whatever its input. Its input is 1.
  "adds":
    summary: >
      Combines two integers by adding them. Its inputs are 2, 3 and 5, as
      a, b and c.
  "subtracts":
    summary: >
      Combines two integers by subtracting the second from the first. Its
      inputs are 2, 3 and 5, as a, b and c.
  "renders-decimal":
    summary: >
      Renders an integer as decimal text, and parses decimal text back
      into the integer. Its input is -42.
  "drops-the-sign":
    summary: >
      Renders the absolute value of an integer as decimal text, and parses
      decimal text back into the integer. Its input is -42.
  "yields-in-order":
    summary: >
      Yields the integers 1 to 5 in order, on every iteration.
  "rotates":
    summary: >
      Yields the integers 1 to 5, rotated one place further on each
      iteration: 1 to 5 first, then 2, 3, 4, 5 and 1.
  "repeats-an-element":
    summary: >
      Yields 1, 2, 2 and 3.
  "wraps-around":
    summary: >
      A counter that starts at 0, rises by one per advance and returns to 0
      after 3. It advances 5 steps.
  "refuses-after-close":
    summary: >
      A resource whose calls succeed until it closes, and fail with its
      closed sentinel after it closes.
  "serves-after-close":
    summary: >
      A resource whose calls succeed before and after it closes. Its closed
      sentinel is a failure that no call returns.

  # The functions and callables that only the property forms take.
  "identity":
    summary: >
      Returns its input.
  "is-non-negative":
    summary: >
      Returns whether its integer input is 0 or more.
  "returns-null":
    summary: >
      Returns null, whatever its input.
  "drops-the-first":
    summary: >
      Returns its list without the first element. An empty list stays
      empty.
  "prepends-zero":
    summary: >
      Returns its list of integers with 0 before the first element.
  "sorts":
    summary: >
      Returns its list of integers in ascending order.
  "wraps-in-a-and-b":
    summary: >
      Returns its text with a before it and b after it.
  "ascending":
    summary: >
      A predicate over two integers, true when the first is not greater
      than the second.
  "fails-on-negative":
    summary: >
      Returns a failure of its own for a negative integer input, and
      success otherwise.
  "raises-on-negative":
    summary: >
      Raises for a negative integer input, and returns otherwise.

# The sequential models that a history vector names in place of a model,
# as a corpus case names a subject. Each implementation builds every named
# model natively.
#
# Every named model accepts a call whose outcome is unknown in every
# state, and checks no output of a write, a put, an append, an enqueue or
# an add. An operation that a model does not define is a fault. States
# compare with the standard's equal unless a summary states otherwise. A
# record states each state as a typed literal: the register's value, the
# map's entries in order, and the queue's and the set's values as a list
# in order.
models:
  "register":
    summary: >
      One value, initially null. write(v) leaves v. read() outputs the
      value and leaves it. A read whose outcome is unknown accepts any
      value.
  "cas-register":
    summary: >
      The register with cas(from, to). A cas outputs true and leaves to
      when the value equals from, and outputs false and leaves the value
      otherwise. A cas whose outcome is unknown takes effect when the value
      equals from, and leaves the value otherwise.
  "key-value":
    summary: >
      A map from keys to strings, initially empty, that stores no empty
      string, so a key it does not store reads as empty. put(k, v) leaves v
      under k. append(k, s) leaves the value under k followed by s. get(k)
      outputs the value under k. The map lists its keys in the order they
      were stored, and a key whose value changes keeps its place. A get
      whose outcome is unknown accepts any map.
  "queue":
    summary: >
      A list of values, initially empty, head first. enqueue(v) adds v at
      the tail. dequeue() removes the head and outputs it, or outputs null
      and leaves an empty queue. A dequeue whose outcome is unknown removes
      the head when one exists.
  "set":
    summary: >
      A set of values, initially empty, listed in the order they were
      added. Two sets are equal when they contain equal values in any
      order.
      add(v) adds v when it is absent. remove(v) outputs whether v is
      present, and leaves the set without v. contains(v) outputs whether v
      is present. A remove whose outcome is unknown removes v when it is
      present, and a contains whose outcome is unknown accepts any set.
  "lossy-register":
    summary: >
      The register whose write may be lost. write(v) leaves v or the value
      before it, in that order. A read is the register's.

# The machine subjects that a machines vector names, as a corpus case
# names a subject. Each implementation builds every machine subject
# natively: the subject, its machine, its draws and its model.
#
# A machine lists its actions in the order its summary states. Each call
# that an action records names no key and completes as ok with its output,
# unless the subject's summary states another completion.
# The steps take the options the vector's setup states, and a machine of
# two clients or more runs its clients as tasks of a scheduler with the
# setup's strategy, two clients and the uniform strategy by default.
machines:
  "queue-loses-on-wrap":
    summary: >
      A queue in a ring of slots, of a capacity drawn under "capacity" as
      an integer in [1, 8]. put(v) returns false when the queue is full.
      Otherwise it writes v at the write index, or into the first slot
      when the write index is at the last slot, moves the index on to the
      next slot, from the last to the first, and returns true. get()
      removes and returns the oldest value, or returns null when the queue
      is empty. The actions are put, whose input is drawn under "v" as an
      integer in [0, 1000], and get, each of which records its one call.
      The model is a queue of the capacity: put outputs whether the queue
      had room and adds v when it had, and get outputs the head and removes
      it, or outputs null.
  "correct-queue":
    summary: >
      The machine of queue-loses-on-wrap over a queue that writes every
      value at its write index.
  "counter-overflows":
    summary: >
      A counter, initially 0. increment adds one to the count, sets the
      count to 0 when the sum is 3, and returns the count. reset sets the
      count to 0 and returns null. The actions are increment and reset,
      each of which records its one call with no arguments. The model is a
      counter: increment outputs the count plus one and leaves it, and
      reset leaves 0.
  "store-loses-on-crash":
    summary: >
      A store of a buffer and a durable map. The actions are put, flush and
      crash. put's input is a key drawn under "key" as an integer in [0, 3]
      and the next value of a counter that starts at 1. put records a call
      of put with the key and the value as arguments, sets the key to the
      value in the buffer, and completes the call with null. flush is a
      drain action, enabled while the buffer is not empty, that moves the
      buffer into the durable map and empties it. crash empties the buffer.
      Neither records a call. The machine has no model. Its settle check
      reads the durable value of each key that a put completed for, and
      fails with the identity lost-write when it is not the last value put
      under the key.
  "racy-counter":
    summary: >
      A counter, initially 0, whose increment reads the count, yields to
      the task scheduler, writes the count plus one and returns it. The
      action is increment, which records its one call with no arguments.
      The model is the counter of counter-overflows.
  "correct-counter":
    summary: >
      The machine of racy-counter over an increment that adds one to the
      count and returns it without yielding.
  "counter-refuses-every-third":
    summary: >
      A counter, initially 0, that refuses every third increment, counted
      over every case of the run. A refused increment completes with fail
      and the error refused, and leaves the count. Any other increment
      adds one to the count and returns it, and read returns the count.
      The actions are increment, enabled while the model's count is below
      3, and read, each of which records its one call with no arguments.
      The model is a counter: increment outputs the count plus one and
      leaves it, and read outputs the count and leaves it. The machine's
      enabled reads a count that the subject's refusals change, so a case
      that repeats an earlier case's choices can list other actions.

assertions:
  "equal":
    arity: 3
    summary: >
      Structural equality. A null collection does not equal an empty
      one, no type coercion, NaN is unequal to itself, floats compare
      exactly and by value so -0 equals +0, cycles stop, functions
      compare by identity.
    detail_fields: [want, got]
    relaxations: [equate-empty, equate-nans]

  "not-equal":
    arity: 3
    summary: >
      Negation of equal.
    detail_fields: [got]
    relaxations: [equate-empty, equate-nans]

  "true":
    arity: 2
    summary: >
      The condition holds. The failure carries the caller's message
      alone.
    detail_fields: []

  "false":
    arity: 2
    summary: >
      The condition does not hold.
    detail_fields: []

  "nil":
    arity: 2
    summary: >
      The value is absent. A typed nil counts as nil.
    detail_fields: [got]

  "not-nil":
    arity: 2
    summary: >
      The value is present. A typed nil counts as nil.
    detail_fields: []

  "length":
    arity: 3
    summary: >
      The container has the stated number of items: the elements of a
      sequence, the entries of a map, the bytes of a byte string, or the
      Unicode scalar values of text. A null value has no length, and
      fails.
    detail_fields: [want, got]

  "empty":
    arity: 2
    summary: >
      The container has no items. A null value is no container, and
      fails.
    detail_fields: [length]

  "not-empty":
    arity: 2
    summary: >
      The container has at least one item. A null value is no container,
      and fails.
    detail_fields: []

  "contains":
    arity: 3
    summary: >
      Text contains a substring, a sequence an element, or a map a key.
      An element or a key compares as equal compares, so an int does not
      match a float.
    detail_fields: [haystack, needle]
    relaxations: [equate-empty, equate-nans]

  "not-contains":
    arity: 3
    summary: >
      Negation of contains.
    detail_fields: [haystack, needle]
    relaxations: [equate-empty, equate-nans]

  "contains-in-order":
    arity: 3
    summary: >
      Text holds every needle, each after the previous one's match ends.
    detail_fields: [haystack, needle, index]

  "permutation":
    arity: 3
    summary: >
      A sequence contains the same elements as another, each as often, in
      any order. Elements compare as equal compares them.
    detail_fields: [want, got]
    relaxations: [equate-empty, equate-nans]

  "has-prefix":
    arity: 3
    summary: >
      Text starts with the given prefix.
    detail_fields: [got, prefix]

  "has-suffix":
    arity: 3
    summary: >
      Text ends with the given suffix.
    detail_fields: [got, suffix]

  "matches":
    arity: 3
    summary: >
      A pattern of the portable subset that string-matching reads matches
      anywhere in the text. $ matches at the end of the text only, \d, \w
      and \s are their ASCII classes, and . matches no line terminator. A
      pattern outside the subset is a failure, not an error.
    detail_fields: [got, pattern]

  "close-to":
    arity: 4
    summary: >
      A number is within a tolerance of another, by absolute difference.
      NaN is outside every tolerance, and so are two equal infinities,
      whose difference is NaN.
    detail_fields: [got, want, tolerance]

  "in-range":
    arity: 4
    summary: >
      A number falls in a closed interval. NaN is in no range, and a
      range with a NaN bound contains no number.
    detail_fields: [got, low, high]

  "pairwise":
    arity: 3
    summary: >
      Every adjacent pair of a sequence satisfies a predicate. Nought or
      one item passes.
    detail_fields: [index, first, second]

  "err-absent":
    arity: 2
    summary: >
      No failure value is present.
    detail_fields: [got]

  "err-present":
    arity: 2
    summary: >
      Some failure value is present.
    detail_fields: []

  "err-is":
    arity: 3
    summary: >
      A failure matches a sentinel, through the chain of wrapped causes.
    detail_fields: [want, got]

  "err-is-not":
    arity: 3
    summary: >
      A failure does not match a sentinel.
    detail_fields: [got]

  "err-as":
    arity: 3
    summary: >
      A failure of the given type is in the chain. Yields it.
    detail_fields: [want, got]

  "throws":
    arity: 2
    summary: >
      A callable raises. Yields what was raised.
    detail_fields: []

  "not-throws":
    arity: 2
    summary: >
      A callable does not raise.
    detail_fields: [got]

  "honours-cancellation":
    arity: 2
    summary: >
      A subject given a cancelled handle reports a cancellation failure.
    detail_fields: [got]

  "honours-deadline":
    arity: 2
    summary: >
      A subject given an expired deadline reports a deadline failure.
    detail_fields: [got]

  "completes-within":
    arity: 3
    summary: >
      A subject finishes before the stated duration. A subject that has
      not returned when the duration has passed fails then, and the
      assertion does not wait for it.
    detail_fields: [want, got]

  "pure":
    arity: 3
    summary: >
      Observed state is unchanged across a call.
    detail_fields: [want, got]
    relaxations: [equate-empty, equate-nans]

  "nil-context-safe":
    arity: 2
    summary: >
      A subject given an absent cancellation handle does not crash.
    detail_fields: [got]

  # The relation family. Each member calls its subject and relates the
  # runs to each other, so a test needs no expected output. A callable
  # that fails or raises fails the member, except where the law requires
  # a failure. The failure, or what the callable raised, takes the place
  # of the value that the callable did not return, and every other detail
  # field is null. A member that takes two callables takes them in the
  # order its law reads.
  "idempotent":
    arity: 4
    summary: >
      Calling a subject twice with one input leaves the observed state that
      calling it once left. first is the observation after one call, and
      second after two.
    detail_fields: [first, second]
    relaxations: [equate-empty, equate-nans]

  "accumulates":
    arity: 4
    summary: >
      Each call of a subject with one input changes an observed integer by
      the same amount, and the first call changes it. first and second are
      the changes of the first and the second call.
    detail_fields: [first, second]

  "deterministic":
    arity: 3
    summary: >
      32 calls of a subject with one input return equal results. first is
      the first result, and second the first result that differs.
    detail_fields: [first, second]
    relaxations: [equate-empty, equate-nans]

  "commutative":
    arity: 4
    summary: >
      Combining a and b gives what combining b and a gives. first is the
      combination of a and b, and second the combination of b and a.
    detail_fields: [first, second]
    relaxations: [equate-empty, equate-nans]

  "associative":
    arity: 5
    summary: >
      Combining the combination of a and b with c gives what combining a
      with the combination of b and c gives. first is the former, and
      second the latter.
    detail_fields: [first, second]
    relaxations: [equate-empty, equate-nans]

  "round-trip":
    arity: 4
    summary: >
      The inverse conversion of the forward conversion of an input returns
      the input. want is the input, and got what came back.
    detail_fields: [want, got]
    relaxations: [equate-empty, equate-nans]

  "stable-order":
    arity: 2
    summary: >
      32 iterations of a subject yield equal sequences. first is the first
      sequence, and second the first sequence that differs.
    detail_fields: [first, second]
    relaxations: [equate-empty, equate-nans]

  "no-duplicates":
    arity: 2
    summary: >
      One iteration of a subject yields each element at most once. got is
      the first element equal to an earlier one, and index its position.
    detail_fields: [got, index]
    relaxations: [equate-empty, equate-nans]

  "monotonic":
    arity: 4
    summary: >
      An observed number never falls and is never NaN while a subject
      advances a stated number of steps. index is the position of the first
      reading that falls or is NaN, the reading before the first step at
      position 0. first is the reading before it, and second that reading.
    detail_fields: [index, first, second]

  "total":
    arity: 3
    summary: >
      A call succeeds for every input of a domain, in order. index is the
      position of the first input for which it fails, and got the failure.
    detail_fields: [index, got]

  "not-pure":
    arity: 3
    summary: >
      Observed state changes across a call. got is the observation that did
      not change.
    detail_fields: [got]
    relaxations: [equate-empty, equate-nans]

  "after-close":
    arity: 4
    summary: >
      After a subject closes, a call fails with a sentinel, through the
      chain of wrapped causes. want is the sentinel, and got what the call
      returned.
    detail_fields: [want, got]

  "poisoned":
    arity: 3
    summary: >
      After a failure is induced, 32 readings each report a failure. index
      is the position of the first reading that does not, and got what it
      returned.
    detail_fields: [index, got]

  "eventually":
    arity: 4
    summary: >
      An assertion body passes within a timeout, retried at an interval.
      Reports the last failure.
    detail_fields: [attempts, last]

  "eventually-true":
    arity: 3
    summary: >
      A predicate becomes true within a timeout, retried with backoff.
    detail_fields: [attempts]

  "no-task-leaks":
    arity: 2
    summary: >
      No concurrent task started in the scope outlives it.
    detail_fields: [leaked]

  "max-allocs":
    arity: 3
    summary: >
      A callable makes at most a stated number of heap allocations per
      call. One call warms it first, and the count is the average over
      the calls after it, rounded down.
    detail_fields: [want, got]

  "max-allocs-with-setup":
    arity: 4
    summary: >
      A callable makes at most a stated number of heap allocations per
      call on an input that a setup builds before each call. The setup is
      not counted. One setup and one call warm both first, and the count
      is the average over the calls after them, rounded down.
    detail_fields: [want, got]

  "golden-match":
    arity: 3
    package: golden
    summary: >
      Output matches the golden file resolved against the conventional
      directory.
    detail_fields: [want, got]

  "golden-match-at":
    arity: 3
    package: golden
    summary: >
      Output matches the golden file at a given path.
    detail_fields: [want, got]

  "golden-match-json-field":
    arity: 4
    package: golden
    summary: >
      Output matches one named field of a golden JSON object.
    detail_fields: [want, got, field]

  "bench-max-latency":
    arity: 1
    package: bench
    summary: >
      The p99 latency per iteration stays within a ceiling.
    detail_fields: [want, got]

  "bench-max-mean":
    arity: 1
    package: bench
    summary: >
      The mean latency per iteration stays within a ceiling.
    detail_fields: [want, got]

  "bench-max-allocs":
    arity: 1
    package: bench
    summary: >
      The allocations per iteration stay within a ceiling.
    detail_fields: [want, got]

  "bench-max-bytes":
    arity: 1
    package: bench
    summary: >
      The bytes allocated per iteration stay within a ceiling.
    detail_fields: [want, got]

  "rejects":
    arity: 2
    summary: >
      A check fails against an implementation it is meant to reject.
      Yields the failure records of the check, in call order.
    detail_fields: []

  "prop-for-all":
    arity: 2
    package: prop
    summary: >
      A body passes for every input a run generates. A run replays the
      stored failures, tries the simplest input and the boundary inputs,
      then generates inputs it has not tested until it has run the stated
      number of cases or tested every input. A fixed sequence of passes
      shrinks a failing case towards the smallest case that fails the
      same way.
    detail_fields: [outcome, cases, rejected, seed, counterexample, failure, choices, others, divergence, coverage]

  "linearizable":
    arity: 3
    package: history
    summary: >
      Every partition of a recorded history has an order of its calls that
      keeps the history's precedence and that the model accepts. A fixed
      search decides it within a budget of model steps and a limit on the
      size of its memo. A search that uses up either is undecided, and an
      undecided history fails.
    detail_fields: [outcome, partitions, steps, partition, calls, concurrency, linearized, states, candidates, limit]

  "serializable":
    arity: 2
    package: history
    summary: >
      A history of list-append transactions exhibits no anomaly that
      serializability forbids, among the dependencies its reads reveal: no
      inconsistent observation, no aborted or intermediate read, and no cycle
      of write, read and anti-dependencies.
    detail_fields: [anomaly, kinds, transactions, cycle, explanation]

  "snapshot-isolation":
    arity: 2
    package: history
    summary: >
      A history of list-append transactions exhibits no anomaly that
      snapshot isolation forbids, among the dependencies its reads reveal: no
      inconsistent observation, no aborted or intermediate read, and no cycle
      in which no two anti-dependencies are adjacent.
    detail_fields: [anomaly, kinds, transactions, cycle, explanation]

# The property form of an assertion runs it on every case of a run, as
# prop-for-all runs a body. Rendering adds one entry for each form,
# "prop-" and the assertion's id, by this rule:
#
# - The package is prop, and the detail fields are those of prop-for-all.
#   failure is the assertion's record of the minimal case.
# - The relaxations are the assertion's.
# - A form over a function takes a function of the generated input where
#   the assertion takes the value it examines, and a callable that also
#   takes the input where the assertion takes a callable. A form whose
#   assertion takes a setup passes the input to the setup, and the setup's
#   result to the callable. Its arity is the assertion's, and it generates
#   one argument, input.
# - The form of a relation generates the arguments that the relation
#   takes. Its arity is the relation's less those arguments.
#
# The other 22 assertions have no form: they retry over time, measure
# time, scope a block, compare a file or a measurement, drive a check,
# check a recorded history, are prop-for-all itself, or read state without
# taking an input. total has none either, because generating its domain is
# the form of err-absent.
forms:
