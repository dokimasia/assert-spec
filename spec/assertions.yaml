# Canonical assertion definitions. Language-neutral.
#
# arity counts required arguments to the function form, excluding the
# failure seat and including the trailing message. A type the caller
# states counts as an argument, whether a language takes it as a value
# or as a type parameter. Optional arguments do not count: the
# relaxations, a golden comparison's scrubbers and a property's options.
#
# package is empty for an assertion in the language's root namespace,
# and names a subpackage otherwise.
#
# relaxations lists the modifiers an assertion accepts. A relaxation
# widens what counts as equal for one call, and never for a whole run.
#
# detail_fields names the values a failure carries, and a failing
# assertion carries exactly these. got is what the assertion observed
# and want is what it required, so an assertion whose failure holds
# neither states no fields and reports the caller's message alone.
version: "2.0.0"

# What a caller may relax, for one call.
#
# Both exist because a dynamically typed language cannot tell two cases
# apart that a statically typed one keeps separate. A language whose
# types already settle the question declares the relaxation absent in
# its overlay rather than shipping one that does nothing.
relaxations:
  "equate-empty":
    summary: >
      An absent container equals an empty one of the same type. Without
      it a null map and an empty map are different values, which is what
      the standard states by default.
  "equate-nans":
    summary: >
      A NaN equals another NaN of the same type. Without it NaN is
      unequal to itself, which is what IEEE 754 states and what the
      standard states by default.

# What a corpus case may hand an assertion in place of a value.
#
# A case states its arguments as typed literals, which cannot describe a
# callable. Most of what the assertions taking one need is a behaviour
# from a small fixed set, so a case names the behaviour and each
# implementation builds it natively. A kind an implementation cannot
# build is a declared skip, the same as any other case.
subjects:
  "returns-ok":
    summary: >
      Does the work and answers success, whatever it was handed.
  "reads-handle":
    summary: >
      Reads the cancellation handle and answers the reason it gives,
      or success when the handle is absent or still running.
  "ignores-handle":
    summary: >
      Answers success without reading the handle at all.
  "raises":
    summary: >
      Raises rather than answering.
  "fails-otherwise":
    summary: >
      Answers a failure of its own, unrelated to any handle it was
      given.
  "dereferences-handle":
    summary: >
      Reads a handle without checking it is there, so a missing one
      crashes it.
  "never-settles":
    summary: >
      Reports a failure on every attempt.
  "settles-after":
    summary: >
      Reports a failure twice and succeeds on the third attempt.
  "accumulates":
    summary: >
      Changes the observed state once per call.
  "leaves-state-alone":
    summary: >
      Reads the observed state and changes nothing.

assertions:
  "equal":
    arity: 3
    summary: >
      Structural equality. A null collection does not equal an empty
      one, no type coercion, NaN is unequal to itself, floats compare
      exactly and by value so -0 equals +0, cycles stop, functions
      compare by identity.
    detail_fields: [want, got]
    relaxations: [equate-empty, equate-nans]

  "not-equal":
    arity: 3
    summary: >
      Negation of equal.
    detail_fields: [got]
    relaxations: [equate-empty, equate-nans]

  "true":
    arity: 2
    summary: >
      The condition holds. The failure carries the caller's message
      alone.
    detail_fields: []

  "false":
    arity: 2
    summary: >
      The condition does not hold.
    detail_fields: []

  "nil":
    arity: 2
    summary: >
      The value is absent. A typed nil counts as nil.
    detail_fields: [got]

  "not-nil":
    arity: 2
    summary: >
      The value is present. A typed nil counts as nil.
    detail_fields: []

  "length":
    arity: 3
    summary: >
      The container has the stated number of items: the elements of a
      sequence, the entries of a map, the bytes of a byte string, or the
      Unicode scalar values of text. A null value has no length, and
      fails.
    detail_fields: [want, got]

  "empty":
    arity: 2
    summary: >
      The container has no items. A null value is no container, and
      fails.
    detail_fields: [length]

  "not-empty":
    arity: 2
    summary: >
      The container has at least one item. A null value is no container,
      and fails.
    detail_fields: []

  "contains":
    arity: 3
    summary: >
      Text contains a substring, a sequence an element, or a map a key.
      An element or a key compares as equal compares, so an int does not
      match a float.
    detail_fields: [haystack, needle]
    relaxations: [equate-empty, equate-nans]

  "not-contains":
    arity: 3
    summary: >
      Negation of contains.
    detail_fields: [haystack, needle]
    relaxations: [equate-empty, equate-nans]

  "contains-in-order":
    arity: 3
    summary: >
      Text holds every needle, each after the previous one's match ends.
    detail_fields: [haystack, needle, index]

  "has-prefix":
    arity: 3
    summary: >
      Text starts with the given prefix.
    detail_fields: [got, prefix]

  "has-suffix":
    arity: 3
    summary: >
      Text ends with the given suffix.
    detail_fields: [got, suffix]

  "matches":
    arity: 3
    summary: >
      A pattern of the portable subset that string-matching reads matches
      anywhere in the text. $ matches at the end of the text only, \d, \w
      and \s are their ASCII classes, and . matches no line terminator. A
      pattern outside the subset is a failure, not an error.
    detail_fields: [got, pattern]

  "close-to":
    arity: 4
    summary: >
      A number is within a tolerance of another, by absolute difference.
      NaN is outside every tolerance, and so are two equal infinities,
      whose difference is NaN.
    detail_fields: [got, want, tolerance]

  "in-range":
    arity: 4
    summary: >
      A number falls in a closed interval. NaN is in no range, and a
      range with a NaN bound contains no number.
    detail_fields: [got, low, high]

  "pairwise":
    arity: 3
    summary: >
      Every adjacent pair of a sequence satisfies a predicate. Nought or
      one item passes.
    detail_fields: [index, first, second]

  "err-absent":
    arity: 2
    summary: >
      No failure value is present.
    detail_fields: [got]

  "err-present":
    arity: 2
    summary: >
      Some failure value is present.
    detail_fields: []

  "err-is":
    arity: 3
    summary: >
      A failure matches a sentinel, through the chain of wrapped causes.
    detail_fields: [want, got]

  "err-is-not":
    arity: 3
    summary: >
      A failure does not match a sentinel.
    detail_fields: [got]

  "err-as":
    arity: 3
    summary: >
      A failure of the given type is in the chain. Yields it.
    detail_fields: [want, got]

  "throws":
    arity: 2
    summary: >
      A callable raises. Yields what was raised.
    detail_fields: []

  "not-throws":
    arity: 2
    summary: >
      A callable does not raise.
    detail_fields: [got]

  "honours-cancellation":
    arity: 2
    summary: >
      A subject given a cancelled handle reports a cancellation failure.
    detail_fields: [got]

  "honours-deadline":
    arity: 2
    summary: >
      A subject given an expired deadline reports a deadline failure.
    detail_fields: [got]

  "completes-within":
    arity: 3
    summary: >
      A subject finishes before the stated duration. A subject that has
      not returned when the duration has passed fails then, and the
      assertion does not wait for it.
    detail_fields: [want, got]

  "pure":
    arity: 3
    summary: >
      Observed state is unchanged across a call.
    detail_fields: [want, got]
    relaxations: [equate-empty, equate-nans]

  "nil-context-safe":
    arity: 2
    summary: >
      A subject given an absent cancellation handle does not crash.
    detail_fields: [got]

  "eventually":
    arity: 4
    summary: >
      An assertion body passes within a timeout, retried at an interval.
      Reports the last failure.
    detail_fields: [attempts, last]

  "eventually-true":
    arity: 3
    summary: >
      A predicate becomes true within a timeout, retried with backoff.
    detail_fields: [attempts]

  "no-task-leaks":
    arity: 2
    summary: >
      No concurrent task started in the scope outlives it.
    detail_fields: [leaked]

  "max-allocs":
    arity: 3
    summary: >
      A callable makes at most a stated number of heap allocations per
      call. One call warms it first, and the count is the average over
      the calls after it, rounded down.
    detail_fields: [want, got]

  "golden-match":
    arity: 3
    package: golden
    summary: >
      Output matches the golden file resolved against the conventional
      directory.
    detail_fields: [want, got]

  "golden-match-at":
    arity: 3
    package: golden
    summary: >
      Output matches the golden file at a given path.
    detail_fields: [want, got]

  "golden-match-json-field":
    arity: 4
    package: golden
    summary: >
      Output matches one named field of a golden JSON object.
    detail_fields: [want, got, field]

  "bench-max-latency":
    arity: 1
    package: bench
    summary: >
      The p99 latency per iteration stays within a ceiling.
    detail_fields: [want, got]

  "bench-max-mean":
    arity: 1
    package: bench
    summary: >
      The mean latency per iteration stays within a ceiling.
    detail_fields: [want, got]

  "bench-max-allocs":
    arity: 1
    package: bench
    summary: >
      The allocations per iteration stay within a ceiling.
    detail_fields: [want, got]

  "bench-max-bytes":
    arity: 1
    package: bench
    summary: >
      The bytes allocated per iteration stay within a ceiling.
    detail_fields: [want, got]

  "rejects":
    arity: 2
    summary: >
      A check fails against an implementation it is meant to reject.
      Yields the failure message.
    detail_fields: []

  "prop-for-all":
    arity: 2
    package: prop
    summary: >
      A body passes for every input a run generates. A run replays the
      stored failures, tries the simplest input and the boundary inputs,
      then generates inputs it has not tested until it has run the stated
      number of cases or tested every input. A fixed sequence of passes
      shrinks a failing case towards the smallest case that fails the
      same way.
    detail_fields: [outcome, cases, rejected, seed, counterexample, failure, choices, others, divergence, coverage]
