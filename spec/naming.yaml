# The rest of what a caller touches: the seam, the seats, and the types
# and helpers beside the assertions. Same rules as the assertion names,
# with the reasons behind the earned spellings noted where they differ.
#
# Go's seat is TB with Helper, Fatalf and Errorf because those are the
# members of testing.TB, and matching them is what lets a *testing.T be
# a seat with no adapter. Go names testing.T for the collector seat for
# the same reason: Fatalf stops the test and Errorf records and carries
# on, which is that seat's contract, supplied by the platform. Its
# benchmark contract is Start, Loop and End rather than loop and check,
# because a Go benchmark runs under testing.B, which owns the iteration
# count: the body runs inside `for c.Loop()` and cannot be a closure
# handed over with a count.
#
# Rust names the contract's runner run because loop is a Rust keyword,
# the same reason Java's throws became throwsException.
surface:
  types:
    "seat":
      go: "TB"
      python: "Seat"
      rust: "Seat"
      typescript: "Seat"
