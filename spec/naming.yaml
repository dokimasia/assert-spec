# The property form of an assertion takes the assertion's name in the prop
# package. Rendering adds one name for each form that the assertion table
# states, under the form's id: the language's qualifier below, followed by
# the assertion's name.
#
# Go's prop package already declares prop.Permutation, the generator of
# permutations, and a Go package cannot declare one name twice. Go names
# the form of permutation IsPermutation, as the other languages name the
# assertion itself.
forms:
  qualifiers:
    go: "prop."
    python: "prop."
    rust: "prop::"
    typescript: "prop."
    java: "Prop."
    kotlin: "Prop."
  exceptions:
    "permutation":
      go: "prop.IsPermutation"
