# The rest of what a caller touches: the seam, the seats, and the types
# and helpers beside the assertions. Same rules as the assertion names,
# with the reasons behind the earned spellings noted where they differ.
#
# Go's seat is TB with Helper, Fatalf and Errorf because those are the
# members of testing.TB, and matching them is what lets a *testing.T be
# a seat with no adapter. Go names testing.T for the collector seat for
# the same reason: Fatalf stops the test and Errorf records and carries
# on, which is that seat's contract, supplied by the platform. Its
# benchmark contract is Start, Loop and End rather than loop and check,
# because a Go benchmark runs under testing.B, which owns the iteration
# count: the body runs inside `for c.Loop()` and cannot be a closure
# handed over with a count.
#
# Rust names the contract's runner run because loop is a Rust keyword,
# the same reason Java's throws became throwsException.
#
# Setup a benchmark excludes from its ceilings has two spellings for one
# meaning, and which one a language takes follows how it writes a
# benchmark body. Go and Python write it inline, under testing.B and
# under a generator, so they mark the setup in place with excluding. The
# other three hand the harness a closure, so they hand it a second one
# for the setup and name that measuring. Each declines the other's,
# because adopting it would make its own benchmarks read worse than they
# do now.
#
# Every language spells a contract's warm-up as one word, as JMH spells
# its Warmup annotation. A parallel body takes the name of Go's
# testing.B.RunParallel, whose kind of body Go's member takes, and Rust
# names it run_parallel after its run. Python and TypeScript decline it:
# CPython's default build runs Python code on one thread at a time, and
# JavaScript runs every worker on one thread.
#
# A seat answers a clock, and a failing assertion hands it a record. Four
# languages state both on the seat itself and give them a default, so a
# seat that says nothing gets the platform clock and a rendered string.
# Go interfaces carry no defaults and testing.T can never grow a member,
# so Go states both as separate interfaces a seat may also satisfy. The
# meaning is the same and the spelling is what the language allows,
# which is why Go names the members here and declines neither.
#
# Reporter and Clocked are the two interfaces that spelling needs. Only
# Go and Java have them, because only they lack interface defaults; the
# other three state the members on the seat itself and decline both.
#
# Java names the platform clock SystemClock because System is
# java.lang.System, which every class in the package would otherwise
# have to qualify. The same reason throws became throwsException.
#
# Java and Kotlin spell the boolean and float generators bool and
# floating, because boolean and float are Java keywords and the two
# languages share one set of names.
#
# A case is a seat, so Go names its note Logf, the testing.TB member for
# a message that a failing test reports, as it names the seat's members.
# The case's cancellation handle is the one honours-cancellation hands a
# subject in each language, and each language names the member after its
# handle: Context for Go's context.Context, signal for TypeScript's
# AbortSignal, cancelled for Java's Supplier<Boolean>, and cancellation
# for Rust's Cancel, because a method named cancel would read as an order
# to cancel. Python and Kotlin cancel a coroutine through its task or its
# job and hand a subject no handle, so both decline the member.
#
# Each language constructs a history as it constructs any value: Go and
# Rust through a function, Python and Kotlin by calling the class, and
# TypeScript and Java with new. A scheduler is constructed the same way.
#
# Machines, steps and its options, and the task scheduler are named in the
# package stateful, as Hypothesis, jqwik and proptest give their state
# machines a module of their own. The options of steps then share no
# namespace with the options of a run, and need no suffix to tell them
# apart. Python spells max as max_steps, because max is a builtin. The
# option that states the scheduler is tasks, because Go's package already
# declares the type Scheduler. The case's history and target are members
# of the case, in prop, because every property body can call them.
#
# Rust spells the scheduler's yield as yield_now, because yield is a Rust
# keyword. Python and Kotlin decline it: an await in an asyncio task, and
# yield() in a coroutine, already suspend the task at a point the
# scheduler sees.
#
# Java and Kotlin name the tree of files FileTree, and the class of its
# assertions and helpers FileTrees, as the JDK pairs Path with Paths. A
# Java test reads and writes files through java.nio.file.Files, and a
# second class of that name would make every such test qualify one of the
# two. Go spells the directory constructor Dir, as io/fs spells ReadDir and
# DirEntry.
