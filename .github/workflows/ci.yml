name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Rendering compares against what is committed, so the diff has
      # to be available. A shallow clone of one commit has no base to
      # compare a pull request against either.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # uv reads .python-version and fetches that Python itself, so
      # nothing here depends on what the runner ships.
      - run: uv sync --extra dev

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      # render, fail on stale JSON, validate, run the validator's own
      # tests, lint the tools and the Markdown.
      - run: make check

      # The implementations vendor these files. A change here is their
      # problem too, so say which ones on the pull request.
      - name: Report what an implementation would have to re-vendor
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" -- \
            spec/ corpus/ overlays/ VERSION)
          if [ -n "$changed" ]; then
            echo "::notice::implementations must re-vendor: $(echo "$changed" | tr '\n' ' ')"
          fi
