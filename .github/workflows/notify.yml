name: Notify implementations
on:
  push:
    branches: [main]
    paths:
      - spec/**
      - corpus/**
      - overlays/**
      - VERSION
  workflow_dispatch:

concurrency:
  group: notify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # An implementation vendors the definition, so a change here reaches it
  # only when someone copies it across. Opening an issue is what turns
  # that from something to remember into something on a list.
  notify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [assert-go, assert-python, assert-typescript, assert-java, assert-rust]
    steps:
      - uses: actions/checkout@v7

      - name: Read what the definition now digests to
        id: spec
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open("spec/manifest.json"))
          print(f"digest={m['digest']}")
          print(f"version={m['version']}")
          PY

      - name: Open a refresh issue where one is not already open
        env:
          GH_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          REPO: dokimasia/${{ matrix.repo }}
          DIGEST: ${{ steps.spec.outputs.digest }}
          VERSION: ${{ steps.spec.outputs.version }}
        run: |
          title="Refresh the vendored definition to ${DIGEST:7:12}"
          if gh issue list --repo "$REPO" --label spec --state open \
               --search "$title" --json title --jq '.[].title' | grep -qF "$title"; then
            echo "$REPO already has one open"
            exit 0
          fi
          gh issue create --repo "$REPO" --label spec --title "$title" --body "$(cat <<BODY
          The definition moved. This implementation vendors a copy, so its
          build is still green against the copy it has.

          - version: \`$VERSION\`
          - digest: \`$DIGEST\`
          - what changed: ${{ github.event.head_commit.message }}
          - commit: ${{ github.sha }}

          Refresh and run the suite:

          \`\`\`sh
          make spec-sync   # or npm run spec:sync, or ./gradlew specSync
          make check
          \`\`\`

          Lagging is allowed. Not knowing is what this issue is for.
          BODY
          )"
