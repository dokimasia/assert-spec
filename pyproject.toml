# This repository ships no library. The project exists so uv can pin a
# Python and the tools that render and check the definition, and so
# anyone can run the same gate CI runs with one command.
[project]
name = "assert-spec-tools"
version = "0.0.0"
description = "Rendering and validation for the assert-spec definition"
# Nothing consumes these tools as a library; they run on the Python
# .python-version pins and nowhere else, so the floor is that.
requires-python = ">=3.12"
dependencies = []

# uv installs the group dev in every environment of the project. ergon
# runs mypy and pytest with uv run, and the targets of the Makefile run
# python with uv run. Each of these runs has yaml and pytest installed.
# ergon pins ruff and mypy itself.
[dependency-groups]
dev = [
    "pyyaml>=6",
    "types-PyYAML>=6",
    "pytest>=9.1",
    "basedpyright>=1.19",
]

[tool.mypy]
files = ["tools"]
python_version = "3.12"
strict = true

# Zed runs basedpyright by default. Without this it reads the system
# Python, finds no yaml, and fills the editor with import errors that
# the command line never shows.
[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "recommended"
# The tools run as scripts, `python tools/render.py`, so tools/ is the
# import root and `prop` is a top-level package, as ruff's src states.
executionEnvironments = [{ root = "tools" }]
reportAny = false
reportExplicitAny = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportImplicitStringConcatenation = false
# unittest sets fixtures in setUp, not __init__, which this rule
# does not model. Every attribute it flags is annotated on the
# class and assigned in setUp.
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false

[tool.uv]
package = false
