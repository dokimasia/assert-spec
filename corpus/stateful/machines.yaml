# Machines: a named machine subject run as a property. Each case names a
# subject of the definition's `machines` section, which states the subject,
# its machine and its draws, and may state:
#
# - `setup`: the options of the subject's steps: `mean`, `max`, `swarm`,
#   `keep`, which lists the names of the actions that every case keeps,
#   and for a subject whose clients or tasks run on a scheduler `clients`,
#   `concurrent`, `concurrent-mean`, `strategy`, which is uniform or
#   {pct: depth}, and `max-releases`.
# - `settings`: the settings of the run, as a behaviour vector states them.
# - `trace`: a trace that the run takes first, as the Draws option does. A
#   draw entry states a label and a value, and a step entry states its
#   action, with `client` in a concurrent section and `drain: true` in the
#   drain.
#
# `detail` is the detail of the run. A machine's counterexample lists its
# steps among its draws, in request order. `error` states the entry, the
# name and the reason of a trace that the run cannot follow, and the
# detail is then null. `make render` writes both.
kind: machines
cases:
  # A failing and a passing run of each subject with a fault. The fault
  # needs more steps than the passing run's max allows.
  - id: queue-loses-on-wrap/a-put-at-the-last-slot-overwrites-the-first-value
    subject: queue-loses-on-wrap
    settings: {seed: "1"}

  - id: queue-loses-on-wrap/two-steps-cannot-fill-the-ring-and-read-it
    subject: queue-loses-on-wrap
    setup: {max: 2}
    settings: {seed: "1"}

  - id: counter-overflows/a-third-increment-without-a-reset-returns-0
    subject: counter-overflows
    settings: {seed: "1"}

  - id: counter-overflows/two-steps-never-overflow
    subject: counter-overflows
    setup: {max: 2}
    settings: {seed: "1"}

  - id: store-loses-on-crash/a-crash-loses-an-acknowledged-put
    subject: store-loses-on-crash
    settings: {seed: "1"}

  - id: store-loses-on-crash/one-step-cannot-put-and-crash
    subject: store-loses-on-crash
    setup: {max: 1}
    settings: {seed: "1"}

  # The queue without a fault passes, with swarm and without it.
  - id: correct-queue/passes-with-swarm
    subject: correct-queue
    settings: {seed: "1"}

  - id: correct-queue/passes-without-swarm
    subject: correct-queue
    setup: {swarm: false}
    settings: {seed: "1"}

  # Every case keeps put without a swarm choice, so a case makes one swarm
  # choice, for get. The run fails as the run without the setup fails.
  - id: queue-loses-on-wrap/a-kept-put-takes-no-swarm-choice
    subject: queue-loses-on-wrap
    setup: {keep: [put]}
    settings: {seed: "1"}

  # Two clients under the task scheduler: the racy counter fails, and the
  # atomic one passes.
  - id: racy-counter/two-increments-on-two-clients-both-return-1
    subject: racy-counter
    settings: {seed: "1"}

  - id: correct-counter/passes-with-two-clients
    subject: correct-counter
    settings: {seed: "1"}

  # A concurrent mean of 0 stops each section at its first flag outside the
  # edge phase, so no section takes the two increments that race.
  - id: racy-counter/a-concurrent-mean-of-0-stops-each-section-before-the-race
    subject: racy-counter
    setup: {concurrent-mean: 0}
    settings: {seed: "1"}

  # A refusal changes which actions a step lists, so a case that repeats an
  # earlier case's choices requests an index with other bounds. The run is
  # flaky, and its divergence names the sequential step of the index.
  - id: counter-refuses-every-third/a-refusal-changes-the-actions-a-step-lists
    subject: counter-refuses-every-third
    setup: {swarm: false}
    settings: {seed: "1"}

  # A flusher task waits until the buffer is set. Its first release in the
  # concurrent section takes a value that client 0 wrote and yields before
  # it stores the value, so a read on client 1 returns null. The same race
  # under pct pins the priority that a woken task keeps.
  - id: register-flushes-in-two-parts/a-read-between-the-two-parts-of-a-flush-returns-null
    subject: register-flushes-in-two-parts
    settings: {seed: "1"}

  - id: register-flushes-in-two-parts/keeps-the-priority-of-a-woken-task-under-pct-3
    subject: register-flushes-in-two-parts
    setup: {strategy: {pct: 3}}
    settings: {seed: "1"}

  - id: register-flushes/passes-with-two-clients
    subject: register-flushes
    settings: {seed: "1"}

  # A ticker sleeps 4 ms before each tick. Under pct a release records no
  # choice, so the choices of a case do not depend on the deadlines that an
  # advance passes, and the shrink lowers the milliseconds alone.
  - id: ticker-skips-its-first-tick/an-advance-of-4-ms-and-a-read-return-0
    subject: ticker-skips-its-first-tick
    setup: {strategy: {pct: 1}}
    settings: {seed: "1"}

  - id: ticker/passes-when-each-tick-runs-at-its-deadline
    subject: ticker
    setup: {strategy: {pct: 1}}
    settings: {seed: "1"}

  # A spin keeps a task ready, so the run fails at the limit of releases.
  - id: spins-until-a-flag/fails-the-case-at-the-release-limit
    subject: spins-until-a-flag
    setup: {max-releases: 50}
    settings: {seed: "1"}

  # Traces: the minimal steps of a failure fail again, a step that is not
  # enabled at its position fails before any case runs, and a concurrent
  # step states its client.
  - id: queue-loses-on-wrap/the-minimal-steps-as-a-trace-fail
    subject: queue-loses-on-wrap
    settings: {seed: "1"}
    trace:
      - {label: capacity, value: {type: int, value: 2}}
      - {step: put}
      - {label: v, value: {type: int, value: 0}}
      - {step: put}
      - {label: v, value: {type: int, value: 1}}
      - {step: get}

  - id: store-loses-on-crash/a-flush-of-an-empty-buffer-is-refused
    subject: store-loses-on-crash
    settings: {seed: "1"}
    trace:
      - {step: crash}
      - {step: flush}

  - id: racy-counter/the-minimal-steps-as-a-trace-state-their-clients
    subject: racy-counter
    settings: {seed: "1"}
    trace:
      - {step: increment, client: 1}
      - {step: increment, client: 2}
