# is-file: a file is at a path, and a link to a file is a link. Each case
# states `workspace`, the tree that the runner writes before the call,
# `args`, the path relative to the workspace's root, and `expect`. The
# runner passes the path of the operating system there, and a message of
# its own.
#
# `detail` is the record of a failure: `got`, the kind of the entry at the
# path, or null for none. `make render` writes it.
kind: is-file
cases:
  - id: is-file/a-file-passes
    workspace:
      type: tree
      entries:
        - {path: docs/a.md, text: "# a\n"}
    args:
      - {type: string, value: docs/a.md}
    expect: pass

  - id: is-file/a-directory-fails
    workspace:
      type: tree
      entries:
        - {path: docs/a.md, text: "# a\n"}
    args:
      - {type: string, value: docs}
    expect: fail

  - id: is-file/a-link-to-a-file-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
        - {path: current, link: a.txt}
    args:
      - {type: string, value: current}
    expect: fail

  - id: is-file/nothing-at-the-path-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
    args:
      - {type: string, value: b.txt}
    expect: fail
