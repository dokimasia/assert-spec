# path-absent: nothing is at a path, a link whose target is missing
# included. Each case states `workspace`, the tree that the runner writes
# before the call, `args`, the path relative to the workspace's root, and
# `expect`. The runner passes the path of the operating system there, and a
# message of its own.
#
# `detail` is the record of a failure: `got`, the kind of the entry at the
# path. `make render` writes it.
kind: path-absent
cases:
  - id: path-absent/nothing-at-the-path-passes
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
    args:
      - {type: string, value: b.txt}
    expect: pass

  # A file has no entries, so nothing is at a path below one.
  - id: path-absent/a-path-below-a-file-passes
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
    args:
      - {type: string, value: a.txt/b}
    expect: pass

  - id: path-absent/a-file-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
    args:
      - {type: string, value: a.txt}
    expect: fail

  - id: path-absent/a-link-whose-target-is-missing-fails
    workspace:
      type: tree
      entries:
        - {path: dangling, link: missing.txt}
    args:
      - {type: string, value: dangling}
    expect: fail
