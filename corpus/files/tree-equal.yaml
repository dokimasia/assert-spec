# tree-equal: the tree read from a directory has the entries of a stated
# tree, no more and no fewer. Each case states `workspace`, the tree that
# the runner writes before the call, `args`, the stated tree, and `expect`.
# The runner passes the workspace's directory, and a message of its own.
#
# A tree literal states a mode as a decimal integer: 420 is 0644, 448 is
# 0700, 384 is 0600 and 493 is 0755.
#
# `detail` is the record of a failure: `want` and `got` state the entries at
# the first 64 paths that differ, and `differences` the number of paths.
# `make render` writes it.
kind: tree-equal
cases:
  - id: tree-equal/equal-trees-pass
    workspace: &every-kind
      type: tree
      entries:
        - {path: bin/run, text: "#!/bin/sh\necho ok\n", executable: true}
        - {path: cache, directory: true}
        - {path: current, link: bin/run}
        - {path: go.mod, text: "module example.com/a\n"}
        - {path: keys, directory: true, mode: 448}
        - {path: keys/id, text: "secret\n", mode: 384}
        - {path: logo.png, bytes: "89504e470d0a1a0a"}
    args: [*every-kind]
    expect: pass

  - id: tree-equal/a-missing-file-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
    args:
      - type: tree
        entries:
          - {path: a.txt, text: "a\n"}
          - {path: b.txt, text: "b\n"}
    expect: fail

  - id: tree-equal/an-extra-file-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
        - {path: b.txt, text: "b\n"}
    args:
      - type: tree
        entries:
          - {path: a.txt, text: "a\n"}
    expect: fail

  # Text and bytes each differ, so the record states both forms.
  - id: tree-equal/another-content-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
        - {path: logo.png, bytes: "89504e47"}
    args:
      - type: tree
        entries:
          - {path: a.txt, text: "b\n"}
          - {path: logo.png, bytes: "89504e48"}
    expect: fail

  - id: tree-equal/another-execute-bit-fails
    workspace:
      type: tree
      entries:
        - {path: run.sh, text: "#!/bin/sh\n", executable: true}
    args:
      - type: tree
        entries:
          - {path: run.sh, text: "#!/bin/sh\n"}
    expect: fail

  - id: tree-equal/another-link-target-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
        - {path: b.txt, text: "b\n"}
        - {path: current, link: a.txt}
    args:
      - type: tree
        entries:
          - {path: a.txt, text: "a\n"}
          - {path: b.txt, text: "b\n"}
          - {path: current, link: b.txt}
    expect: fail

  - id: tree-equal/a-file-in-place-of-a-directory-fails
    workspace:
      type: tree
      entries:
        - {path: cache, text: ""}
    args:
      - type: tree
        entries:
          - {path: cache, directory: true}
    expect: fail

  - id: tree-equal/an-extra-empty-directory-fails
    workspace:
      type: tree
      entries:
        - {path: a.txt, text: "a\n"}
        - {path: cache, directory: true}
    args:
      - type: tree
        entries:
          - {path: a.txt, text: "a\n"}
    expect: fail

  - id: tree-equal/another-stated-mode-fails
    workspace:
      type: tree
      entries:
        - {path: keys/id, text: "secret\n", mode: 420}
    args:
      - type: tree
        entries:
          - {path: keys/id, text: "secret\n", mode: 384}
    expect: fail

  - id: tree-equal/a-stated-directory-that-an-entry-implies-passes
    workspace:
      type: tree
      entries:
        - {path: src/a.go, text: "package a\n"}
    args:
      - type: tree
        entries:
          - {path: src, directory: true}
          - {path: src/a.go, text: "package a\n"}
    expect: pass

  - id: tree-equal/a-read-mode-that-the-wanted-tree-does-not-state-passes
    workspace:
      type: tree
      entries:
        - {path: keys, directory: true, mode: 448}
        - {path: keys/id, text: "secret\n", mode: 384}
    args:
      - type: tree
        entries:
          - {path: keys/id, text: "secret\n"}
    expect: pass

  # A workspace sets 0644 on a file, and 0755 on an executable file and on a
  # directory, where its tree states no mode.
  - id: tree-equal/a-workspace-sets-0644-and-0755-where-a-tree-states-no-mode
    workspace:
      type: tree
      entries:
        - {path: bin/run, text: "#!/bin/sh\n", executable: true}
        - {path: notes.txt, text: "notes\n"}
    args:
      - type: tree
        entries:
          - {path: bin, directory: true, mode: 493}
          - {path: bin/run, text: "#!/bin/sh\n", mode: 493}
          - {path: notes.txt, text: "notes\n", mode: 420}
    expect: pass

