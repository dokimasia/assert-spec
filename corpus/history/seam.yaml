# Seam: calls recorded through the history, as a script or as intervals.
# Each case pins the events the history records, in its JSON form, or the
# entry that the seam refuses.
#
# A script entry with `invoke` opens a call under a number of the script,
# and an entry with `ok`, `fail` or `unknown` completes the call it names.
# An interval entry states a client, an operation, args, keys and a start
# time. A completed entry also states its end and its completion kind, with
# an output or an error. An entry without an end is pending.
#
# `events` is the history's events, or null when the seam refuses an entry.
# `refused` is the position of that entry, from 0: the script entry whose
# call raises a usage error, or the entry that from-intervals names in its
# error. `make render` writes both.
kind: seam
cases:
  # Recording.
  - id: history/a-client-continues-on-a-new-process-after-unknown
    script:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {unknown: 0, error: the reply was lost}
      - {invoke: 1, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: int, value: 1}}

  - id: history/a-completion-names-the-invocation-of-its-call
    script:
      - {invoke: 0, client: 0, operation: put, args: [{type: string, value: k}, {type: string, value: v}], keys: [{type: string, value: k}]}
      - {invoke: 1, client: 1, operation: get, args: [{type: string, value: k}], keys: [{type: string, value: k}]}
      - {ok: 1, output: {type: string, value: v}}
      - {ok: 0, output: {type: "null"}}

  # Client 1 invokes first, so it runs on process 0.
  - id: history/a-failed-call-keeps-its-process
    script:
      - {invoke: 0, client: 1, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {invoke: 1, client: 0, operation: write, args: [{type: int, value: 2}], keys: [{type: string, value: x}]}
      - {fail: 0, error: connection refused}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 2}}

  # The write declares no key, so it touches every key.
  - id: history/a-pending-call-has-no-completion
    script:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: []}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {unknown: 1, error: timed out}
      - {invoke: 2, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 1}}

  # From intervals.
  - id: history/from-intervals-puts-an-invocation-before-a-completion-at-one-time
    intervals:
      - {client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}], start: 10, end: 20, kind: ok, output: {type: "null"}}
      - {client: 1, operation: read, args: [], keys: [{type: string, value: x}], start: 20, end: 30, kind: ok, output: {type: int, value: 1}}

  # The write starts first. The two reads start at 5 and all three end at
  # 9, each in the order of the entries.
  - id: history/from-intervals-keeps-the-given-order-at-one-time
    intervals:
      - {client: 2, operation: read, args: [], keys: [{type: string, value: x}], start: 5, end: 9, kind: ok, output: {type: "null"}}
      - {client: 0, operation: read, args: [], keys: [{type: string, value: x}], start: 5, end: 9, kind: ok, output: {type: "null"}}
      - {client: 1, operation: write, args: [{type: int, value: 7}], keys: [{type: string, value: x}], start: 0, end: 9, kind: ok, output: {type: "null"}}

  - id: history/from-intervals-starts-a-new-process-after-an-unknown-entry
    intervals:
      - {client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}], start: 0, end: 4, kind: unknown, error: timed out}
      - {client: 1, operation: write, args: [{type: int, value: 2}], keys: [{type: string, value: x}], start: 1, end: 2, kind: fail, error: connection refused}
      - {client: 1, operation: read, args: [], keys: [{type: string, value: x}], start: 3, end: 6, kind: ok, output: {type: int, value: 1}}
      - {client: 0, operation: read, args: [], keys: [{type: string, value: x}], start: 5, end: 7, kind: ok, output: {type: int, value: 1}}

  - id: history/from-intervals-records-an-entry-without-an-end-as-pending
    intervals:
      - {client: 1, operation: read, args: [], keys: [{type: string, value: x}], start: 2, end: 3, kind: ok, output: {type: int, value: 1}}
      - {client: 0, operation: write, args: [{type: int, value: 1}], keys: [], start: 1}

  # Usage errors.
  - id: history/refuses-an-invocation-while-the-clients-call-is-open
    script:
      - {invoke: 0, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}

  # Call 0 has completed, though its client has invoked again since.
  - id: history/refuses-a-second-completion-of-one-call
    script:
      - {invoke: 0, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {unknown: 0, error: timed out}

  # Interval errors. The pending entry 1 and entry 2 of client 0 share the
  # instant 3. Entry 2 is named, because it comes later in the given order.
  - id: history/from-intervals-refuses-entries-of-one-client-that-share-an-instant
    intervals:
      - {client: 1, operation: read, args: [], keys: [{type: string, value: x}], start: 0, end: 9, kind: ok, output: {type: "null"}}
      - {client: 0, operation: read, args: [], keys: [{type: string, value: x}], start: 3}
      - {client: 0, operation: read, args: [], keys: [{type: string, value: x}], start: 0, end: 3, kind: ok, output: {type: "null"}}

  # Entry 2 overlaps entry 0 too, and entry 1 comes first.
  - id: history/from-intervals-refuses-an-entry-that-ends-before-it-starts
    intervals:
      - {client: 0, operation: read, args: [], keys: [{type: string, value: x}], start: 0, end: 2, kind: ok, output: {type: "null"}}
      - {client: 1, operation: read, args: [], keys: [{type: string, value: x}], start: 5, end: 3, kind: ok, output: {type: "null"}}
      - {client: 0, operation: read, args: [], keys: [{type: string, value: x}], start: 1, end: 3, kind: ok, output: {type: "null"}}
