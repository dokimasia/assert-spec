# Linearizable: a history checked against a named model. Each case names a
# model of the definition's `models` section and states its history as a
# script of the seam. A case may also state `budget`, `memo-limit` and
# `workers`, each a positive integer. A check reports what a check on one
# worker reports, whatever its workers.
#
# `expect` is pass or fail, as in the corpus of an assertion. `detail` is
# the detail of the record of a check that fails. A check that passes
# reports no record, and its detail states the outcome, the partitions and
# the steps, with null for each field that describes a reported partition.
# `make render` writes both.
kind: linearizable
cases:
  # Verdicts: a pass and a violation of each named model.
  - id: linearizable/concurrent-writes-take-effect-in-the-order-a-read-needs
    model: register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {invoke: 1, client: 1, operation: write, args: [{type: int, value: 2}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 1}}

  - id: linearizable/a-read-after-a-completed-write-misses-it
    model: register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: "null"}}

  - id: linearizable/one-of-two-concurrent-compare-and-sets-succeeds
    model: cas-register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: cas, args: [{type: int, value: 1}, {type: int, value: 2}], keys: [{type: string, value: x}]}
      - {invoke: 2, client: 2, operation: cas, args: [{type: int, value: 1}, {type: int, value: 3}], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: bool, value: false}}
      - {ok: 1, output: {type: bool, value: true}}
      - {invoke: 3, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 3, output: {type: int, value: 2}}

  - id: linearizable/two-concurrent-compare-and-sets-cannot-both-succeed
    model: cas-register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: cas, args: [{type: int, value: 1}, {type: int, value: 2}], keys: [{type: string, value: x}]}
      - {invoke: 2, client: 2, operation: cas, args: [{type: int, value: 1}, {type: int, value: 3}], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: bool, value: true}}
      - {ok: 2, output: {type: bool, value: true}}

  - id: linearizable/an-append-follows-a-concurrent-put
    model: key-value
    history:
      - {invoke: 0, client: 0, operation: put, args: [{type: string, value: k}, {type: string, value: a}], keys: [{type: string, value: k}]}
      - {invoke: 1, client: 1, operation: append, args: [{type: string, value: k}, {type: string, value: b}], keys: [{type: string, value: k}]}
      - {ok: 1, output: {type: "null"}}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: get, args: [{type: string, value: k}], keys: [{type: string, value: k}]}
      - {ok: 2, output: {type: string, value: ab}}

  - id: linearizable/sequential-appends-take-effect-in-their-order
    model: key-value
    history:
      - {invoke: 0, client: 0, operation: append, args: [{type: string, value: k}, {type: string, value: a}], keys: [{type: string, value: k}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: append, args: [{type: string, value: k}, {type: string, value: b}], keys: [{type: string, value: k}]}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: get, args: [{type: string, value: k}], keys: [{type: string, value: k}]}
      - {ok: 2, output: {type: string, value: ba}}

  - id: linearizable/concurrent-enqueues-dequeue-in-either-order
    model: queue
    history:
      - {invoke: 0, client: 0, operation: enqueue, args: [{type: int, value: 1}], keys: [{type: string, value: q}]}
      - {invoke: 1, client: 1, operation: enqueue, args: [{type: int, value: 2}], keys: [{type: string, value: q}]}
      - {ok: 0, output: {type: "null"}}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: dequeue, args: [], keys: [{type: string, value: q}]}
      - {ok: 2, output: {type: int, value: 2}}
      - {invoke: 3, client: 0, operation: dequeue, args: [], keys: [{type: string, value: q}]}
      - {ok: 3, output: {type: int, value: 1}}

  - id: linearizable/a-queue-dequeues-in-the-order-it-enqueued
    model: queue
    history:
      - {invoke: 0, client: 0, operation: enqueue, args: [{type: int, value: 1}], keys: [{type: string, value: q}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 0, operation: enqueue, args: [{type: int, value: 2}], keys: [{type: string, value: q}]}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 1, operation: dequeue, args: [], keys: [{type: string, value: q}]}
      - {ok: 2, output: {type: int, value: 2}}

  - id: linearizable/a-contains-concurrent-with-an-add-may-miss-it
    model: set
    history:
      - {invoke: 0, client: 0, operation: add, args: [{type: int, value: 1}], keys: [{type: string, value: s}]}
      - {invoke: 1, client: 1, operation: contains, args: [{type: int, value: 1}], keys: [{type: string, value: s}]}
      - {ok: 1, output: {type: bool, value: false}}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 2, client: 1, operation: contains, args: [{type: int, value: 1}], keys: [{type: string, value: s}]}
      - {ok: 2, output: {type: bool, value: true}}

  - id: linearizable/a-removed-value-is-not-contained
    model: set
    history:
      - {invoke: 0, client: 0, operation: add, args: [{type: int, value: 1}], keys: [{type: string, value: s}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 0, operation: remove, args: [{type: int, value: 1}], keys: [{type: string, value: s}]}
      - {ok: 1, output: {type: bool, value: true}}
      - {invoke: 2, client: 1, operation: contains, args: [{type: int, value: 1}], keys: [{type: string, value: s}]}
      - {ok: 2, output: {type: bool, value: true}}

  - id: linearizable/a-lossy-write-may-leave-the-old-value
    model: lossy-register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: "null"}}

  - id: linearizable/a-lossy-write-that-a-read-saw-is-not-lost-later
    model: lossy-register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: int, value: 1}}
      - {invoke: 2, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: "null"}}

  # Frontiers: a violation of each named model, with the order, the states
  # and the candidates the search stopped at.
  - id: linearizable/the-memo-merges-two-orders-of-equal-writes
    model: register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {invoke: 1, client: 1, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 5}}

  - id: linearizable/three-concurrent-compare-and-sets-cannot-all-succeed
    model: cas-register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: cas, args: [{type: int, value: 1}, {type: int, value: 2}], keys: [{type: string, value: x}]}
      - {invoke: 2, client: 2, operation: cas, args: [{type: int, value: 1}, {type: int, value: 3}], keys: [{type: string, value: x}]}
      - {invoke: 3, client: 0, operation: cas, args: [{type: int, value: 1}, {type: int, value: 4}], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: bool, value: true}}
      - {ok: 2, output: {type: bool, value: true}}
      - {ok: 3, output: {type: bool, value: true}}

  - id: linearizable/a-get-after-two-appends-misses-them
    model: key-value
    history:
      - {invoke: 0, client: 0, operation: put, args: [{type: string, value: k}, {type: string, value: a}], keys: [{type: string, value: k}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: append, args: [{type: string, value: k}, {type: string, value: b}], keys: [{type: string, value: k}]}
      - {invoke: 2, client: 2, operation: append, args: [{type: string, value: k}, {type: string, value: c}], keys: [{type: string, value: k}]}
      - {ok: 1, output: {type: "null"}}
      - {ok: 2, output: {type: "null"}}
      - {invoke: 3, client: 0, operation: get, args: [{type: string, value: k}], keys: [{type: string, value: k}]}
      - {ok: 3, output: {type: string, value: a}}

  - id: linearizable/a-dequeue-outputs-a-value-nobody-enqueued
    model: queue
    history:
      - {invoke: 0, client: 0, operation: enqueue, args: [{type: int, value: 1}], keys: [{type: string, value: q}]}
      - {invoke: 1, client: 1, operation: enqueue, args: [{type: int, value: 2}], keys: [{type: string, value: q}]}
      - {ok: 1, output: {type: "null"}}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 2, client: 1, operation: dequeue, args: [], keys: [{type: string, value: q}]}
      - {ok: 2, output: {type: int, value: 3}}

  - id: linearizable/the-memo-merges-two-orders-of-adds
    model: set
    history:
      - {invoke: 0, client: 0, operation: add, args: [{type: int, value: 1}], keys: [{type: string, value: s}]}
      - {invoke: 1, client: 1, operation: add, args: [{type: int, value: 2}], keys: [{type: string, value: s}]}
      - {ok: 0, output: {type: "null"}}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: contains, args: [{type: int, value: 3}], keys: [{type: string, value: s}]}
      - {ok: 2, output: {type: bool, value: true}}

  - id: linearizable/a-read-outputs-a-value-no-lossy-write-left
    model: lossy-register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {invoke: 1, client: 1, operation: write, args: [{type: int, value: 2}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 3}}

  # Completions.
  - id: linearizable/a-failed-write-takes-no-effect
    model: register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {fail: 0, error: connection refused}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: int, value: 1}}

  - id: linearizable/a-write-whose-outcome-is-unknown-takes-effect-later
    model: register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: write, args: [{type: int, value: 2}], keys: [{type: string, value: x}]}
      - {invoke: 2, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 1}}
      - {unknown: 1, error: timed out}
      - {invoke: 3, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 3, output: {type: int, value: 2}}

  - id: linearizable/a-write-whose-outcome-is-unknown-may-never-take-effect
    model: register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: write, args: [{type: int, value: 2}], keys: [{type: string, value: x}]}
      - {unknown: 1, error: timed out}
      - {invoke: 2, client: 0, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 1}}

  - id: linearizable/a-pending-write-takes-effect-when-a-later-read-needs-it
    model: register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: int, value: 1}}

  # The state equals from, so the compare-and-set takes effect, and an
  # output of false is wrong.
  - id: linearizable/a-compare-and-set-that-refuses-a-matching-value-is-violated
    model: cas-register
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: cas, args: [{type: int, value: 1}, {type: int, value: 2}], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: bool, value: false}}

  # Partitions.
  - id: linearizable/partitions-are-searched-in-the-order-of-their-first-invocation
    model: key-value
    history:
      - {invoke: 0, client: 0, operation: put, args: [{type: string, value: y}, {type: string, value: "1"}], keys: [{type: string, value: y}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: get, args: [{type: string, value: x}], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: string, value: "5"}}
      - {invoke: 2, client: 2, operation: get, args: [{type: string, value: y}], keys: [{type: string, value: y}]}
      - {ok: 2, output: {type: string, value: "1"}}

  - id: linearizable/a-call-on-two-keys-joins-their-partitions
    model: key-value
    history:
      - {invoke: 0, client: 0, operation: get, args: [{type: string, value: x}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: string, value: ""}}
      - {invoke: 1, client: 1, operation: put, args: [{type: string, value: y}, {type: string, value: "2"}], keys: [{type: string, value: y}, {type: string, value: x}]}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 2, operation: get, args: [{type: string, value: y}], keys: [{type: string, value: y}]}
      - {ok: 2, output: {type: string, value: "3"}}

  - id: linearizable/a-call-that-declares-no-key-touches-every-key
    model: key-value
    history:
      - {invoke: 0, client: 0, operation: put, args: [{type: string, value: x}, {type: string, value: "1"}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: put, args: [{type: string, value: y}, {type: string, value: "2"}], keys: [{type: string, value: y}]}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 2, operation: get, args: [{type: string, value: y}], keys: []}
      - {ok: 2, output: {type: string, value: "3"}}

  # Limits. Partition x needs two steps and two configurations, and
  # partition y one of each.
  - id: linearizable/a-search-stops-before-a-step-past-its-budget
    model: register
    budget: 1
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: int, value: 1}}
      - {invoke: 2, client: 2, operation: read, args: [], keys: [{type: string, value: y}]}
      - {ok: 2, output: {type: "null"}}

  - id: linearizable/a-memo-limit-counts-a-bit-per-call-for-each-configuration
    model: register
    memo-limit: 3
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {invoke: 1, client: 1, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 1, output: {type: int, value: 1}}
      - {invoke: 2, client: 2, operation: read, args: [], keys: [{type: string, value: y}]}
      - {ok: 2, output: {type: "null"}}

  # The second write steps from two states, and the budget stops it after
  # the first.
  - id: linearizable/a-budget-stops-a-search-between-two-states
    model: lossy-register
    budget: 2
    history:
      - {invoke: 0, client: 0, operation: write, args: [{type: int, value: 1}], keys: [{type: string, value: x}]}
      - {invoke: 1, client: 1, operation: write, args: [{type: int, value: 2}], keys: [{type: string, value: x}]}
      - {ok: 0, output: {type: "null"}}
      - {ok: 1, output: {type: "null"}}
      - {invoke: 2, client: 2, operation: read, args: [], keys: [{type: string, value: x}]}
      - {ok: 2, output: {type: int, value: 2}}

  # Workers. Partition a is undecided at the budget, b is violated, and c
  # would pass. One worker stops at b, so the steps count a and b.
  - id: linearizable/four-workers-report-what-one-worker-reports
    model: key-value
    budget: 2
    workers: 4
    history:
      - {invoke: 0, client: 0, operation: put, args: [{type: string, value: a}, {type: string, value: "1"}], keys: [{type: string, value: a}]}
      - {invoke: 1, client: 1, operation: put, args: [{type: string, value: a}, {type: string, value: "2"}], keys: [{type: string, value: a}]}
      - {invoke: 2, client: 2, operation: put, args: [{type: string, value: a}, {type: string, value: "3"}], keys: [{type: string, value: a}]}
      - {ok: 0, output: {type: "null"}}
      - {ok: 1, output: {type: "null"}}
      - {ok: 2, output: {type: "null"}}
      - {invoke: 3, client: 0, operation: get, args: [{type: string, value: b}], keys: [{type: string, value: b}]}
      - {ok: 3, output: {type: string, value: "9"}}
      - {invoke: 4, client: 1, operation: put, args: [{type: string, value: c}, {type: string, value: "1"}], keys: [{type: string, value: c}]}
      - {ok: 4, output: {type: "null"}}
      - {invoke: 5, client: 1, operation: get, args: [{type: string, value: c}], keys: [{type: string, value: c}]}
      - {ok: 5, output: {type: string, value: "1"}}
