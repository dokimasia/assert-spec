# Coverage: the verdict on one requirement at one check. A case states
# the cases the label counted, the valid cases, the required share,
# whether the check is the run's last, and whether the run tested every
# input of its domain. Most cases sit on a boundary of the Wilson test,
# where an implementation that evaluates the bound in another order
# decides the other way. `make render` writes the outputs.
