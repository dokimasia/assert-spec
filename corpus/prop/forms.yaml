# Forms: each property form, run from a seed over a shape. A case names
# the form, the kinds of the subjects that its assertion takes, and the
# values that the assertion takes beside them. The subjects come in the
# order the assertion takes them. The values are typed literals in the
# order a corpus case of the assertion states them, without the value
# that a function of the input replaces. A subject takes the generated
# arguments in place of the input or the operands that its summary
# states. err-is and err-as take the subject's own failure as their
# sentinel and its type as their type.
#
# The form generates its arguments from the shape, under the labels of
# the forms rule. Each case pins the detail of the run, as a behaviour
# vector does. A failing run's failure is the assertion's record of the
# minimal case: its assertion, and the detail fields that a typed literal
# can state and that no earlier case decides. The runner passes the form a
# message, and both records state it as their contract.
#
# Every form has a passing case and a failing case, except prop-max-allocs:
# no case can state an allocation count. `make render` writes the outputs,
# and refuses a case whose run depends on what earlier cases leave in a
# subject.
kind: forms

# The shapes the cases generate from.
shapes:
  int: &int {shape: int, width: 32, signed: true, min: -1000, max: 1000}
  natural: &natural {shape: int, width: 32, signed: true, min: 0, max: 1000}
  negative: &negative {shape: int, width: 32, signed: true, min: -1000, max: -1}
  ints: &ints {shape: list, of: *int}
  positives: &positives {shape: list, of: {shape: int, width: 32, signed: true, min: 1, max: 1000}}
  text: &text {shape: string}

cases:
  - id: prop-equal/passes-when-both-functions-return-the-input
    form: prop-equal
    subjects: [identity, identity]
    shape: *ints
    seed: "7"
  - id: prop-equal/fails-when-a-sort-reorders-the-input
    form: prop-equal
    subjects: [sorts, identity]
    shape: *ints
    seed: "7"

  - id: prop-not-equal/passes-when-a-zero-is-prepended
    form: prop-not-equal
    subjects: [prepends-zero, identity]
    shape: *ints
    seed: "7"
  - id: prop-not-equal/fails-when-both-functions-return-the-input
