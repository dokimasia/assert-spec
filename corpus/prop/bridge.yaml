# The fuzz bridge: a generator applied to a fuzzer's bytes, stated as
# lowercase hexadecimal. Each case pins the choices the bytes decode to
# and the value. Every byte string decodes to a valid case.
# `make render` writes the outputs.
kind: bridge
cases:
  - id: bridge/reads-the-fewest-bytes-that-cover-an-integer-range
    generator: {gen: integer, min: 0, max: 1000}
    bytes: "e803"
  - id: bridge/reduces-an-integer-modulo-the-size-of-its-range
    generator: {gen: integer, min: -5, max: 5}
    bytes: "0c"
  - id: bridge/reads-no-byte-for-a-choice-with-one-value
    generator: {gen: list, of: {gen: integer, min: 0, max: 9}, min_size: 2, max_size: 2}
    bytes: "0307"
  - id: bridge/reads-a-float-as-eight-little-endian-bytes
    generator: {gen: float, min: "-Inf", max: "Inf"}
    bytes: "000000000000f83f"
  - id: bridge/reads-a-float-of-width-32-as-four-bytes
    generator: {gen: float, min: 0, max: 10, width: 32}
    bytes: "0000c03f"
  - id: bridge/takes-the-target-for-a-float-outside-its-bounds
    generator: {gen: float, min: 0, max: 1}
    bytes: "0000000000000040"
  - id: bridge/reads-a-byte-string-one-byte-per-byte
    generator: {gen: bytes}
    bytes: "050068656c6c6f"
  - id: bridge/ends-a-sequence-at-its-last-whole-element
    generator: {gen: string, alphabet: "ab", min_size: 3, max_size: 10}
    bytes: "0501"
  - id: bridge/takes-the-target-once-the-bytes-run-out
    generator: {gen: list, of: {gen: integer, min: 0, max: 65535}, max_size: 3}
    bytes: "0134"
  # 3 is rejected and its byte is spent; the next attempt reads 4.
  - id: bridge/reads-a-filter-attempt-after-a-rejected-one
    generator: {gen: filter, of: {gen: integer, min: 0, max: 9}, keep: {kind: divisible-by, n: 2}}
    bytes: "0304"
  # 1, 3 and 5 are rejected, and the 6 after them is never read.
  - id: bridge/rejects-a-filter-after-three-rejected-attempts
    generator: {gen: filter, of: {gen: integer, min: 0, max: 9}, keep: {kind: divisible-by, n: 2}}
    bytes: "01030506"
