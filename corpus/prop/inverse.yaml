# Inverse: a value run backwards to the choices that decode to it. Each case
# states a shape or a generator and a value, and pins the choices. Every
# shape and every generator has a vector. Where more than one sequence of
# choices decodes to the value, the generator vectors pin which one comes
# first: one-of's first alternative that produces the value, sampled-from's
# first equal value, the smallest index at each swap of a permutation, the
# greedy match of a pattern, absent before present, the base before the
# extension, and a map's entries and a set's elements in shortlex order of
# their own choices. A zoned-date-time and a wall-time run back through
# the whole range. `make render` writes the outputs.
kind: inverse
cases:
  - id: integer/a-value-is-its-own-choice
    generator: {gen: integer, min: 0, max: 9}
    value: {type: int, value: 7}
  - id: duration/a-value-is-its-own-choice
    generator: {gen: duration, min: 0, max: 1000000000}
    value: {type: int, value: 1000}
  - id: float/a-value-is-its-own-choice
    generator: {gen: float, min: -2, max: 2}
    value: {type: float, value: 1.5}
  - id: boolean/true-is-one
    generator: {gen: boolean}
    value: {type: bool, value: true}
  - id: just/makes-no-choice
    generator: {gen: just, value: {type: int, value: 4}}
    value: {type: int, value: 4}
  - id: sampled-from/the-first-equal-value
    generator:
      gen: sampled-from
      values: [{type: string, value: a}, {type: string, value: b}, {type: string, value: a}]
    value: {type: string, value: a}
  - id: one-of/the-first-alternative-that-produces-the-value
    generator:
      gen: one-of
      of: [{gen: integer, min: 0, max: 9}, {gen: integer, min: 5, max: 15}]
    value: {type: int, value: 7}
  - id: optional/absent-at-the-outer-optional
    generator: {gen: optional, of: {gen: optional, of: {gen: integer, min: 0, max: 9}}}
    value: {type: "null"}
  - id: list/flags-and-elements-in-order
    generator: {gen: list, of: {gen: integer, min: 0, max: 9}, max_size: 3}
    value: {type: list, of: int, value: [7, 3]}
  - id: dict/entries-in-shortlex-order
    generator:
      gen: dict
      keys: {gen: integer, min: 0, max: 9}
      values: {gen: integer, min: 0, max: 9}
    value:
      type: map
      entries:
        - [{type: int, value: 4}, {type: int, value: 0}]
        - [{type: int, value: 1}, {type: int, value: 9}]
  - id: string/indices-into-the-alphabet
    generator: {gen: string, max_size: 4}
    value: {type: string, value: a0}
  - id: string-matching/the-greedy-match
    generator: {gen: string-matching, pattern: "a*a*"}
    value: {type: string, value: aa}
  - id: bytes/the-bytes-in-order
    generator: {gen: bytes}
    value: {type: bytes, value: 00ff}
  - id: permutation/the-smallest-index-at-each-swap
    generator:
      gen: permutation
      values: [{type: int, value: 1}, {type: int, value: 1}, {type: int, value: 2}]
    value: {type: list, of: int, value: [1, 2, 1]}
  - id: recursive/the-base-before-the-extension
    generator:
      gen: recursive
      base: {gen: list, of: {gen: integer, min: 0, max: 9}}
      extend: {gen: list, of: {gen: self}, max_size: 3}
    value: {type: list, items: []}
  - id: filter/through-its-source
    generator:
      gen: filter
      of: {gen: integer, min: 0, max: 9}
      keep: {kind: divisible-by, n: 2}
    value: {type: int, value: 4}

  - id: bool/true
    shape: {shape: bool}
    value: {type: bool, value: true}
  - id: int/the-two-halves-of-minus-one
    shape: {shape: int, width: 128, signed: true}
    value: {type: int, value: -1}
  - id: float/negative-zero
    shape: {shape: float, width: 64}
    value: {type: float, value: -0.0}
  - id: char/a-stated-alphabet
    shape: {shape: char, alphabet: xyz}
    value: {type: string, value: z}
  - id: string/a-pattern
    shape: {shape: string, pattern: "[A-Z]{3}-[0-9]{2}"}
    value: {type: string, value: ABC-12}
  - id: bytes/two-bytes
    shape: {shape: bytes}
    value: {type: bytes, value: 7f01}
  - id: list/a-list-of-bools
    shape: {shape: list, of: {shape: bool}}
    value: {type: list, of: bool, value: [true, false]}
  - id: fixed-list/three-bytes
    shape: {shape: fixed-list, of: {shape: int, width: 8, signed: false}, size: 3}
    value: {type: list, of: int, value: [1, 2, 3]}
  - id: set/elements-in-shortlex-order
    shape: {shape: set, of: {shape: int, width: 8, signed: false}}
    value: {type: list, of: int, value: [5, 2]}
  - id: map/entries-in-shortlex-order
    shape: {shape: map, key: {shape: string}, of: {shape: bool}}
    value:
      type: map
      entries:
        - [{type: string, value: b}, {type: bool, value: true}]
        - [{type: string, value: a}, {type: bool, value: false}]
  - id: optional/present
    shape: {shape: optional, of: {shape: int, width: 8, signed: false}}
    value: {type: int, value: 9}
  - id: record/fields-in-order
    shape: {shape: record, fields: [[id, {shape: int, width: 8, signed: false}], [ok, {shape: bool}]]}
    value: {type: record, fields: [[id, {type: int, value: 4}], [ok, {type: bool, value: true}]]}
  - id: enum/a-variant-with-a-payload
    shape: {shape: enum, variants: [[none, null], [some, {shape: int, width: 8, signed: false}]]}
    value: {type: variant, name: some, payload: {type: int, value: 9}}
  - id: literal/the-first-equal-value
    shape:
      shape: literal
      values: [{type: string, value: a}, {type: string, value: b}, {type: string, value: a}]
    value: {type: string, value: a}
  - id: ref/a-tree-of-one-child
    shape:
      shape: ref
      name: tree
      definitions:
        tree:
          shape: record
          fields:
            - [value, {shape: int, width: 8, signed: false}]
            - [children, {shape: list, of: {shape: ref, name: tree}}]
    value:
      type: record
      fields:
        - [value, {type: int, value: 3}]
        - - children
          - type: list
            items:
              - type: record
                fields: [[value, {type: int, value: 4}], [children, {type: list, items: []}]]
  - id: uuid/sixteen-bytes
    shape: {shape: uuid}
    value: {type: bytes, value: 00112233445566778899aabbccddeeff}
  - id: ip-address/version-4-of-either
    shape: {shape: ip-address}
    value: {type: bytes, value: 7f000001}
  - id: decimal/the-unscaled-value
    shape: {shape: decimal, scale: 2}
    value: {type: int, value: 1999}
  - id: instant/nanoseconds-before-the-epoch
    shape: {shape: instant, unit: ns}
    value: {type: record, fields: [[seconds, {type: int, value: -1}], [units, {type: int, value: 999999999}]]}
  - id: date/the-first-day-of-year-1
    shape: {shape: date}
    value: {type: int, value: -719162}
  - id: time-of-day/the-last-millisecond
    shape: {shape: time-of-day, unit: ms}
    value: {type: int, value: 86399999}
  - id: local-date-time/the-epoch
    shape: {shape: local-date-time, unit: s}
    value: {type: record, fields: [[date, {type: int, value: 0}], [time-of-day, {type: int, value: 0}]]}
  - id: duration/a-negative-duration
    shape: {shape: duration, unit: ms}
    value: {type: int, value: -5}
  - id: offset/a-fractional-offset
    shape: {shape: offset}
    value: {type: int, value: 20700}
  - id: zone/kathmandu
    shape: {shape: zone}
    value: {type: string, value: Asia/Kathmandu}
  - id: zoned-date-time/an-instant-at-a-change-takes-the-whole-range
    shape: {shape: zoned-date-time, unit: s}
    value:
      type: record
      fields:
        - [instant, {type: record, fields: [[seconds, {type: int, value: -1740355200}], [units, {type: int, value: 0}]]}]
        - [zone, {type: string, value: Europe/Amsterdam}]
  - id: wall-time/utc-makes-no-choice-of-a-change
    shape: {shape: wall-time, unit: s}
    value:
      type: record
      fields:
        - [local-date-time, {type: record, fields: [[date, {type: int, value: 1}], [time-of-day, {type: int, value: 2}]]}]
        - [zone, {type: string, value: UTC}]
