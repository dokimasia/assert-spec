# The store: the entry a runner writes for a property's minimal failing
# case and the entry's file name, or the verdict a runner gives the text of
# one file of a test's store directory. A verdict is replay, other, skip or
# damaged. `make render` writes the outputs.
kind: store
cases:
  - id: store/names-an-entry-by-its-contract-and-token
    contract: decoding undoes encoding
    choices: [1, 0, 1, -1, 0]
    identity: {assertion: equal, file: codec_test.go, line: 18}
    counterexample:
      - {label: values, value: {type: list, of: int, value: [0, -1]}}
    definition: "1.2.0"
    found: "2026-10-01"
  - id: store/names-the-same-choices-of-another-contract-otherwise
    contract: encoding is deterministic
    choices: [1, 0, 1, -1, 0]
    identity: {assertion: equal, file: codec_test.go, line: 31}
    counterexample:
      - {label: values, value: {type: list, of: int, value: [0, -1]}}
    definition: "1.2.0"
    found: "2026-10-01"
  - id: store/names-an-entry-of-no-choices
    contract: an empty request is refused
    choices: []
    identity: {file: server_test.go, line: 40}
    counterexample: []
    definition: "1.2.0"
    found: "2026-10-01"
  - id: store/records-a-draw-without-a-typed-literal-by-its-label
    contract: a closed connection refuses writes
    choices: [3]
    identity: {error: ErrClosed, file: conn_test.go, line: 12}
    counterexample:
      - {label: conn}
    definition: "1.2.0"
    found: "2026-10-01"
  - id: store/records-an-assertion-without-a-location-by-its-contract
    contract: a stored session expires
    choices: [7]
    identity: {assertion: equal, contract: the session is gone}
    counterexample:
      - {label: ttl, value: {type: int, value: 7}}
    definition: "1.2.0"
    found: "2026-10-01"
  # A counterexample with a step entry is written as format 2, with its steps
  # among its draws in request order.
  - id: store/writes-format-2-for-a-counterexample-with-steps
    contract: the queue behaves like a slice
    choices: [2, 1, 1, 1, 1, 0, 1, 1, 1, 1, 0]
    identity: {assertion: linearizable, file: queue_test.go, line: 31}
    counterexample:
      - {label: capacity, value: {type: int, value: 2}}
      - {step: put}
      - {label: v, value: {type: int, value: 0}}
      - {step: put, client: 1}
      - {label: v, value: {type: int, value: 1}}
      - {step: get, drain: true}
    definition: "16.3.0"
    found: "2026-11-10"

  - id: store/replays-an-entry-of-the-property
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [], "found": "2026-10-01"}
  - id: store/replays-an-entry-of-another-definition-version
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.1.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [], "found": "2026-09-01"}
  - id: store/ignores-an-entry-of-another-property
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "encoding is deterministic",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 31},
       "choices": "prop1:AAc", "counterexample": [], "found": "2026-10-01"}
  - id: store/replays-an-entry-of-format-2
    contract: decoding undoes encoding
    text: |
      {"store": 2, "definition": "16.3.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "found": "2026-11-10", "counterexample": [
       {"step": "put"}, {"label": "v"}, {"step": "get", "client": 1},
       {"step": "deliver", "drain": true}]}
  - id: store/skips-an-entry-of-a-later-format
    contract: decoding undoes encoding
    text: '{"store": 3, "layout": "unknown to format 2"}'
  - id: store/skips-an-entry-of-a-format-beyond-64-bits
    contract: decoding undoes encoding
    text: '{"store": 100000000000000000000}'
  - id: store/skips-an-entry-whose-token-is-of-a-later-version
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop2:AAc", "counterexample": [], "found": "2026-10-01"}
  - id: store/rejects-text-that-is-not-json
    contract: decoding undoes encoding
    text: "store: 1"
  - id: store/rejects-an-object-that-repeats-a-name
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "choices": "prop1:AAM",
       "counterexample": [], "found": "2026-10-01"}
  - id: store/rejects-an-entry-without-a-field-of-the-format
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": []}
  - id: store/rejects-an-entry-with-a-field-the-format-does-not-state
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [], "found": "2026-10-01",
       "comment": "found in review"}
  - id: store/rejects-a-token-not-in-canonical-form
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc=", "counterexample": [], "found": "2026-10-01"}
  - id: store/rejects-a-step-entry-in-format-1
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "16.3.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [{"step": "put"}], "found": "2026-11-10"}
  - id: store/rejects-a-step-entry-of-a-client-and-the-drain
    contract: decoding undoes encoding
    text: |
      {"store": 2, "definition": "16.3.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [{"step": "put", "client": 1, "drain": true}],
       "found": "2026-11-10"}
  - id: store/rejects-a-drain-mark-that-is-not-true
    contract: decoding undoes encoding
    text: |
      {"store": 2, "definition": "16.3.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [{"step": "put", "drain": false}],
       "found": "2026-11-10"}
  - id: store/rejects-a-client-below-0
    contract: decoding undoes encoding
    text: |
      {"store": 2, "definition": "16.3.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [{"step": "put", "client": -1}],
       "found": "2026-11-10"}
  - id: store/rejects-an-identity-of-no-stated-shape
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "line": 18},
       "choices": "prop1:AAc", "counterexample": [], "found": "2026-10-01"}
  # The root, the counterexample and the draw are three levels, and the
  # value's 61 arrays make 64.
  - id: store/replays-an-entry-nested-64-levels
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "found": "2026-10-01", "counterexample": [{"label": "v", "value":
       [[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[
       ]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]}]}
  - id: store/rejects-an-entry-nested-65-levels
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "found": "2026-10-01", "counterexample": [{"label": "v", "value":
       [[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[
       ]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]}]}
  - id: store/rejects-a-line-past-2-to-the-31-minus-1
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 2147483648},
       "choices": "prop1:AAc", "counterexample": [], "found": "2026-10-01"}
  - id: store/rejects-a-date-the-calendar-does-not-have
    contract: decoding undoes encoding
    text: |
      {"store": 1, "definition": "1.2.0", "property": "decoding undoes encoding",
       "identity": {"assertion": "equal", "file": "codec_test.go", "line": 18},
       "choices": "prop1:AAc", "counterexample": [], "found": "2026-02-30"}
